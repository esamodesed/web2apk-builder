name: Build Flutter Debug APK

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      package_name:
        description: 'Package name (contoh: com.reymd.myapp)'
        required: true
        type: string
      priority:
        description: 'owner / user'
        required: false
        default: 'user'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROJECT_URL: ${{ inputs.project_url }}
      APP_NAME: ${{ inputs.app_name }}
      PKG_NAME: ${{ inputs.package_name }}
    steps:
      - name: Download & validate project
        run: |
          curl -fL --retry 3 -o project.zip "$PROJECT_URL"
          mkdir -p project
          unzip -q project.zip -d project
          PUB=$(find project -name pubspec.yaml -not -path "*/build/*" | head -n 1)
          if [ -z "$PUB" ]; then
            echo "::error::ZIP bukan project Flutter (pubspec.yaml tidak ditemukan)"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # dependency lama sering tidak kompatibel dengan Flutter terbaru (mis. font_awesome_flutter 10.x)
          flutter pub upgrade --major-versions || flutter pub get
          flutter pub get
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          # Flutter minta Gradle >= 8.14; naikkan wrapper kalau project masih lebih rendah
          WP=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$WP" ]; then
            CUR=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-(bin|all)' "$WP" | head -1 | sed -E 's/gradle-([0-9.]+)-.*/\1/')
            echo "Gradle wrapper saat ini: ${CUR:-tidak diketahui}"
            if [ -n "$CUR" ] && [ "$CUR" != "8.14" ] && [ "$(printf '%s\n8.14\n' "$CUR" | sort -V | head -1)" = "$CUR" ]; then
              sed -i -E 's#gradle-[0-9.]+-(bin|all)\.zip#gradle-8.14-all.zip#' "$WP"
              echo "Gradle wrapper dinaikkan ke 8.14"
            fi
          fi
          # AGP minimal 8.11.1 (Flutter baru minta ini); naikkan kalau project lebih rendah
          python3 - << 'PY_AGP'
          import re, os
          TARGET = (8, 11, 1)
          def ver_fix(m):
              v = tuple(int(x) for x in m.group(2).split('.'))
              return m.group(1) + '8.11.1' + m.group(3) if v < TARGET else m.group(0)
          for f in ['android/settings.gradle.kts', 'android/settings.gradle', 'android/build.gradle.kts', 'android/build.gradle']:
              if not os.path.exists(f):
                  continue
              s = open(f, encoding='utf-8').read()
              new = re.sub(r'(com\.android\.application["\']?\)?\s*version\s*["\'])(\d+(?:\.\d+)+)(["\'])', ver_fix, s)
              new = re.sub(r'(com\.android\.tools\.build:gradle:)(\d+(?:\.\d+)+)()', ver_fix, new)
              if new != s:
                  open(f, 'w', encoding='utf-8').write(new)
                  print('AGP dinaikkan di', f)
          PY_AGP
          # Kotlin minimal 2.2.20 (Flutter baru minta ini); naikkan kalau project lebih rendah
          python3 - << 'PY_KGP'
          import re, os
          TARGET = (2, 2, 20)
          def ver_fix(m):
              v = tuple(int(x) for x in m.group(2).split('.'))
              return m.group(1) + '2.2.20' + m.group(3) if v < TARGET else m.group(0)
          for f in ['android/settings.gradle.kts', 'android/settings.gradle', 'android/build.gradle.kts', 'android/build.gradle']:
              if not os.path.exists(f):
                  continue
              s = open(f, encoding='utf-8').read()
              new = re.sub(r'(org\.jetbrains\.kotlin\.android["\']?\)?\s*version\s*["\'])(\d+(?:\.\d+)+)(["\'])', ver_fix, s)
              new = re.sub(r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)(\d+(?:\.\d+)+)()', ver_fix, new)
              new = re.sub(r'(kotlin_version\s*=\s*["\'])(\d+(?:\.\d+)+)(["\'])', ver_fix, new)
              if new != s:
                  open(f, 'w', encoding='utf-8').write(new)
                  print('Kotlin dinaikkan di', f)
          PY_KGP
          # font_awesome_flutter 11: FontAwesomeIcons bukan IconData lagi. Sesuaikan otomatis file yang memakai FontAwesome.
          python3 - << 'PY_FA'
          import glob, re
          for f in glob.glob('lib/**/*.dart', recursive=True):
              s = open(f, encoding='utf-8').read()
              if 'font_awesome_flutter' not in s:
                  continue
              n = re.sub(r'\bIcon\(\s*FontAwesomeIcons\.', 'FaIcon(FontAwesomeIcons.', s)
              n = re.sub(r'\bIconData\?', 'dynamic', n)
              n = re.sub(r'\bIconData\b', 'dynamic', n)
              if n != s:
                  open(f, 'w', encoding='utf-8').write(n)
                  print('FontAwesome disesuaikan:', f)
          PY_FA
          # set applicationId & label sesuai input (groovy & kts)
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E "s/applicationId[[:space:]]*=?[[:space:]]*\"[^\"]*\"/applicationId = \"$PKG_NAME\"/" "$f"
          done
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --debug

      - name: Collect APK
        run: |
          SAFE=$(echo "$APP_NAME" | tr -cd 'A-Za-z0-9_-')
          mkdir -p out
          find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name "*.apk" | while read -r apk; do
            cp "$apk" "out/${SAFE}-$(basename "$apk")"
          done
          ls -la out
          test -n "$(ls out/*.apk 2>/dev/null)" || { echo "::error::Tidak ada APK yang terbentuk"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: out/*.apk
          retention-days: 3
