name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      project_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      priority:
        required: false
        type: string
        default: 'user'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        abi:
          - android-arm
          - android-arm64
          - android-x64
          - fat
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      - name: Download Project
        run: |
          curl -L "${{ inputs.project_url }}" -o project.zip
          mkdir project
          unzip -q project.zip -d project
          cd project
          if [ ! -f pubspec.yaml ]; then
            SUB=$(find . -maxdepth 2 -name pubspec.yaml | head -1 | xargs dirname 2>/dev/null)
            [ -n "$SUB" ] && mv $SUB/* . 2>/dev/null && mv $SUB/.* . 2>/dev/null
          fi
      
      - name: Get Dependencies
        run: cd project && flutter pub get
      
      - name: Build APK (${{ matrix.abi }})
        run: |
          cd project
          if [ "${{ matrix.abi }}" = "fat" ]; then
            flutter build apk --release --no-tree-shake-icons
          else
            flutter build apk --release --target-platform ${{ matrix.abi }} --no-tree-shake-icons
          fi
      
      - name: Rename
        run: |
          cd project
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ inputs.app_name }}-${{ matrix.abi }}.apk
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}-${{ github.run_id }}
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
