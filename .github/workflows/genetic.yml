name: Build Genetic APK

run-name: ${{ inputs.build_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: 'URL ZIP (project Flutter atau folder lib/ tanpa pubspec.yaml)'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      package_name:
        description: 'Package name (contoh: com.reymd.myapp)'
        required: true
        type: string
      priority:
        description: 'owner / user'
        required: false
        default: 'user'
        type: string
      build_id:
        description: 'ID unik build (diisi bot)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g
      PROJECT_URL: ${{ inputs.project_url }}
      APP_NAME: ${{ inputs.app_name }}
      PKG_NAME: ${{ inputs.package_name }}
    steps:
      - name: Download & detect project
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o project.zip "$PROJECT_URL"
          rm -rf project && mkdir -p project
          unzip -q project.zip -d project
          PUB=$(find project -name pubspec.yaml -not -path "*/build/*" | head -n 1 || true)
          if [ -n "$PUB" ]; then
            SRC=$(dirname "$PUB")
            MODE=project
          else
            LIBF=$(find project -path "*/lib/*" -name "*.dart" -not -path "*/build/*" | head -n 1 || true)
            if [ -z "$LIBF" ]; then
              echo "::error::ZIP tidak berisi project Flutter maupun folder lib/ (.dart)"
              exit 1
            fi
            SRC="${LIBF%%/lib/*}"
            MODE=genetic
          fi
          echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"
          echo "GENETIC_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Mode: $MODE | sumber: $SRC"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Flutter disamakan dengan project (Dart >= 3.9 = Flutter 3.35)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Prepare project
        run: |
          set -euo pipefail
          if [ "$GENETIC_MODE" = "genetic" ]; then
            # Tanpa pubspec.yaml: buat project Flutter baru, lalu pasang kode dari ZIP
            GEN="$GITHUB_WORKSPACE/genetic_app"
            rm -rf "$GEN"
            flutter create --platforms=android --project-name genetic_app "$GEN"
            cd "$GEN"
            rm -rf lib
            cp -r "$GITHUB_WORKSPACE/$SRC_DIR/lib" lib
            if [ -d "$GITHUB_WORKSPACE/$SRC_DIR/assets" ]; then cp -r "$GITHUB_WORKSPACE/$SRC_DIR/assets" assets; fi
            # cari package dari import, lalu tambahkan otomatis
            PKGS=$(grep -rhoE "package:[a-zA-Z0-9_]+/" lib | sed -E 's/package://; s#/##' | sort -u | grep -vE '^(flutter|flutter_test|flutter_localizations|dart)$' || true)
            for p in $PKGS; do
              flutter pub add "$p" || echo "::warning::gagal menambah package $p"
            done
            flutter pub get
            echo "PROJECT_DIR=$GEN" >> "$GITHUB_ENV"
          else
            cd "$SRC_DIR"
            flutter pub get
            if [ ! -d android ]; then
              flutter create --platforms=android .
            fi
            echo "PROJECT_DIR=$(pwd)" >> "$GITHUB_ENV"
          fi

      - name: Set package & name
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E "s/applicationId[[:space:]]*=?[[:space:]]*\"[^\"]*\"/applicationId = \"$PKG_NAME\"/" "$f" || true
          done
          if [ "$GENETIC_MODE" = "genetic" ]; then
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" android/app/src/main/AndroidManifest.xml
          fi

      - name: Build release APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Collect APK
        run: |
          set -euo pipefail
          MAN="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          RAW=$(grep -o 'android:label="[^"]*"' "$MAN" | head -n 1 | sed -E 's/.*="([^"]*)"/\1/' || true)
          if [[ "$RAW" == @string/* ]]; then
            KEY=${RAW#@string/}
            RAW=$(grep -o "<string name=\"$KEY\">[^<]*</string>" "$PROJECT_DIR/android/app/src/main/res/values/strings.xml" 2>/dev/null | head -n 1 | sed -E 's/.*>([^<]*)<.*/\1/' || true)
          fi
          SAFE=$(echo "$RAW" | tr ' ' '_' | tr -cd 'A-Za-z0-9_-')
          [ -z "$SAFE" ] && SAFE="app"
          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name "*.apk" | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "::error::Tidak ada APK yang terbentuk"
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/${SAFE}.apk"
          echo "APK: ${SAFE}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-genetic
          path: out/*.apk
          retention-days: 3
