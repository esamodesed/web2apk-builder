# ==========================================
# REY X BONTEN - Flutter Debug APK Builder
# ZIP project Flutter → Debug APK (1 universal)
# ==========================================

name: Build Flutter Debug APK

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      app_name:
        description: 'App Name'
        required: false
        default: 'FlutterApp'
        type: string
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.reymd.flutterapp'
        type: string
      priority:
        description: 'Priority (owner / user)'
        required: false
        default: 'user'
        type: string

permissions:
  contents: read

concurrency:
  group: rey-debug-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Download & Extract Project
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 --retry-delay 3 \
            --connect-timeout 20 --max-time 600 \
            -A "REY-BUILD-WORKER/1.0" \
            "${{ inputs.project_url }}" -o project.zip

          if ! unzip -t project.zip >/dev/null 2>&1; then
            echo "::error::File terdownload bukan ZIP valid."
            head -c 400 project.zip || true
            exit 1
          fi

          mkdir -p project
          unzip -q project.zip -d project
          cd project

          # Flatten single top-level folder
          COUNT=$(find . -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ]; then
            ONLY=$(find . -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            if [ -n "$ONLY" ]; then
              shopt -s dotglob
              mv "$ONLY"/* . 2>/dev/null || true
              rmdir "$ONLY" 2>/dev/null || true
            fi
          fi

          ROOT="$(find . -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            find . -maxdepth 3 -type f | head -40
            exit 1
          fi
          echo "FLUTTER_PROJECT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
          echo "Flutter project: $ROOT"

      - name: Get dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build Debug APK
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-tree-shake-icons

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$FLUTTER_PROJECT" -type f -path '*/build/app/outputs/flutter-apk/*' -name 'app-debug.apk' | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find "$FLUTTER_PROJECT" -type f -path '*/build/app/outputs/flutter-apk/*' -name '*.apk' -size +10k | head -1 || true)"
          fi
          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi
          cp "$APK" "output/${{ inputs.app_name }}-debug.apk"
          echo "APK: $APK ($(du -h "output/${{ inputs.app_name }}-debug.apk" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-debug-${{ github.run_id }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 1
